<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://127.0.0.1:8000 http://localhost:8000; font-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000">
<meta name="robots" content="noindex, nofollow">
<!-- The attachment grid's slot art is linked relative to the site root (./assets/...) -->
<base href="/">
<title>Atlas - Player Lookup</title>
<link rel="icon" type="image/svg+xml" href="/assets/images/atlas-logo.svg">
<!-- Cache-busting: the ?v= params are content hashes, scripts/release_prep.py rewrites them -->
<link rel="stylesheet" href="/css/styles.css?v=d14a6d5dab">
<link rel="stylesheet" href="/css/atlas.css?v=40db4db46f">
</head>

<body class="atlas-page atlas-lookup-page">

<header class="header-expanded">
  <div class="header-glow" aria-hidden="true"></div>
  <div class="header-scroll">
  <div class="header-content">
    <nav class="atlas-header-nav" aria-label="Atlas">
    <a id="atlas-home-btn" class="header-nav-btn atlas-home-btn" href="/" aria-label="EFTForge">
      <span class="atlas-home-label" data-atlas-text="returnTo"></span>
      <h2>EFTForge</h2>
    </a>
    </nav>
    <div id="lang-switcher">
      <select id="lang-select">
        <option value="en">EN</option>
        <option value="zh">简中</option>
      </select>
    </div>
    <div id="atlas-tz-switch" class="atlas-tz-switch" role="group">
      <span class="optimizer-segmented">
        <button class="optimizer-segmented-btn" type="button" data-atlas-tz="utc8">UTC+8</button>
        <button class="optimizer-segmented-btn" type="button" data-atlas-tz="local" data-atlas-text="tzLocal"></button>
      </span>
    </div>
    <div class="atlas-header-center">
    <nav id="atlas-mode-switch" class="atlas-mode-switch">
      <a class="atlas-mode-btn" data-atlas-gamemode="pve">PvE</a>
      <a class="atlas-mode-btn" data-atlas-gamemode="pvp">PvP</a>
      <a class="atlas-mode-btn" data-atlas-gamemode="season">PvP S</a>
      <a class="atlas-mode-btn" data-atlas-gamemode="arena">Arena</a>
    </nav>
    </div>
    <nav class="atlas-header-nav atlas-header-pages" aria-label="Atlas">
    <a class="header-nav-btn atlas-page-btn" href="/atlas" data-atlas-page="changes">
      <span class="header-nav-btn-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 4v4.5H8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="profile-nav-label"></span>
    </a>
    <a class="header-nav-btn atlas-page-btn" href="/atlas/matching" data-atlas-page="servers">
      <span class="header-nav-btn-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="2.5" width="13" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="10.5" width="13" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="5" r="0.95" fill="currentColor"/><circle cx="5.5" cy="13" r="0.95" fill="currentColor"/><path d="M9 5H12.5M9 13H12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="profile-nav-label"></span>
    </a>
    <a class="header-nav-btn atlas-page-btn" href="/atlas/players" data-atlas-page="players">
      <span class="header-nav-btn-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="6" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M2.8 16c.5-3.2 3.1-5.2 6.2-5.2s5.7 2 6.2 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="profile-nav-label"></span>
    </a>
    </nav>
    <div class="atlas-brand" aria-label="Atlas">
      <img class="atlas-brand-wordmark" src="/assets/images/atlas-wordmark.svg" alt="Atlas" draggable="false">
      <img class="atlas-brand-logo" src="/assets/images/atlas-logo.svg" alt="" draggable="false">
    </div>
  </div>
  </div>
</header>
<div class="header-spacer"></div>

<div class="atlas-bg" aria-hidden="true"><div class="atlas-bg-dots"></div><div class="page-bg-blob"></div><div class="page-bg-vignette"></div></div>

<div id="atlas-lookup-app" class="atlas-lookup">
  <!-- The search card: a header band like the profile's, the field and its button below -->
  <section class="atlas-lookup-search">
    <div class="atlas-lookup-band">
      <svg class="atlas-lookup-band-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <h1 class="atlas-lookup-title" data-atlas-text="title"></h1>
    </div>
    <div class="atlas-lookup-search-body">
      <p class="atlas-lookup-note" data-atlas-text="note"></p>
      <form id="atlas-lookup-form" class="atlas-lookup-form" autocomplete="off">
        <label class="atlas-lookup-field">
          <svg class="atlas-lookup-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="atlas-lookup-account" class="atlas-search" type="text" maxlength="15" spellcheck="false">
        </label>
        <button id="atlas-lookup-go" class="modal-btn primary" type="submit" data-atlas-text="lookup"></button>
      </form>
      <div class="atlas-lookup-meta">
        <span id="atlas-lookup-when" class="atlas-lookup-when"></span>
        <div class="atlas-lookup-actions">
          <button id="atlas-lookup-names" class="modal-btn atlas-lookup-names-btn" type="button" aria-haspopup="dialog" aria-expanded="false" hidden></button>
          <span id="atlas-lookup-ban" class="atlas-lookup-ban" hidden></span>
          <button id="atlas-lookup-save" class="modal-btn atlas-lookup-save" type="button" data-atlas-text="saveImage" hidden></button>
        </div>
      </div>
    </div>
  </section>

  <div id="atlas-lookup-status" class="atlas-empty" hidden></div>
  <div id="atlas-lookup-choices" class="atlas-lookup-choices" hidden></div>

  <!-- The profile:
       laid out in the game's coordinates on a wider canvas, scaled to fit the frame
       (atlas-lookup.js fitScreen) -->
  <div id="atlas-lookup-result" class="atlas-lookup-result" hidden>
    <div id="atlas-lookup-frame" class="ga-frame">
      <div id="atlas-lookup-screen" class="ga-screen"></div>
    </div>
  </div>
</div>

<!-- EFTForge's hover tooltip (utils.js); without it the browser's own would show -->
<div id="eft-tooltip"></div>

<script src="/modules/config.js?v=9212ffa0ee"></script>
<script src="/modules/lang.js?v=c0521776ba"></script>
<script src="/modules/utils.js?v=bb6061e926"></script>
<script src="/modules/atlas-mode.js?v=0833c78834"></script>
<script src="/modules/api.js?v=deb636f55e"></script>
<script src="/modules/build-codes.js?v=894afa0083"></script>
<script src="/data/atlas-skill-buffs.js?v=afdd9a77aa"></script>
<script src="/modules/atlas-lookup.js?v=c9d75748a3"></script>
<script src="/modules/attachment-grid.js?v=8d105e98fa"></script>
</body>
</html>
