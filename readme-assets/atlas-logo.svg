    <path d="M6 15 L22 9 L42 15 L58 9 V49 L42 55 L22 49 L6 55 Z" stroke-width="3"/>
    <path d="M22 9 V49 M42 15 V55" stroke-width="2.2"/>
  </g>
  <path d="M32 21 L39.5 32 L32 43 L24.5 32 Z"
        fill="#eaf4fd" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke"/>
</svg>
